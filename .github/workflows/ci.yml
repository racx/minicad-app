name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# One job, one gate: `bin/ci` (config/ci.rb) is what CLAUDE.md says must pass,
# so it is what GitHub runs. The generated workflow this replaces ran a subset
# of it — no Node, no `npm ci`, so the engine's 34 suites and the Vite build
# never ran here at all, and the Rails suite's one real DWG conversion shelled
# out to a converter whose dependency was never installed. Every pull request
# was red for that reason, including the ones that only bumped an action.
jobs:
  ci:
    runs-on: ubuntu-latest
    # bin/ci is ~30 s locally. Anything past this is wedged, not slow, and a
    # wedged job would otherwise sit there burning runner minutes for hours.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    # NOT DATABASE_URL. Rails merges that into the CURRENT environment's config
    # only, and bin/ci spans three: bin/setup prepares development, the suite
    # runs in test, the seeds step sets RAILS_ENV itself. db:test:prepare built
    # its config from database.yml, found no host, and went looking for a Unix
    # socket that does not exist on a runner. database.yml names no host at all,
    # so libpq reads these instead — every step, every environment, over TCP.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # The suite is 70 tests in 3.5 s. Past 50 Rails forks a worker per core,
      # and each one creates and schema-loads its own minicad_app_test-N — more
      # setup than the run costs. It is also the one part of the suite that can
      # HANG rather than fail: a worker that cannot make its database leaves the
      # parent waiting on DRb forever, which is exactly what happened testing
      # this workflow locally. Raise it when the suite is big enough to earn it.
      PARALLEL_WORKERS: "1"

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # packages/dwg's converter and packages/engine's suites are npm
      # workspaces; without this the DWG endpoint test cannot run at all.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run bin/ci
        run: bin/ci
