name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# One job, one gate: `bin/ci` (config/ci.rb) is what CLAUDE.md says must pass,
# so it is what GitHub runs. The generated workflow this replaces ran a subset
# of it — no Node, no `npm ci`, so the engine's 34 suites and the Vite build
# never ran here at all, and the Rails suite's one real DWG conversion shelled
# out to a converter whose dependency was never installed. Every pull request
# was red for that reason, including the ones that only bumped an action.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # packages/dwg's converter and packages/engine's suites are npm
      # workspaces; without this the DWG endpoint test cannot run at all.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run bin/ci
        run: bin/ci
